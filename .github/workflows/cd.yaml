name: CD Pipeline

on:
  push: 
    branches:
      - devel
      - stage

permissions:
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '15'

      - name: Install dependencies
        run: npm install --legacy-peer-deeps

      - name: Build project
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: ./terraform
        run: terraform init

      - name: Select Workspace
        working-directory: ./terraform
        run: terraform workspace select ${{github_ref_name}} || terraform workspace new ${{ github_ref_name }}

      - name: terraform apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -var-file="environments/${{ github_ref_name }}.tfvars"

      - name: Sync build to S3
        working-directory: ./terraform
        run: |
          BUCKET=${terraform output -raw site_bucket_name}
          aws s3 sync ../build "s3://BUCKET" --delete

      - name: Invalidate Cloudfront cache
        working-directory: ./terraform
        run: |
          DIST_ID=${terraform ouput -raw cloudfront_distribution_id}
          aws cloudfront create-invalidation --distribution-i "$DIST_ID" --paths "/*"

      - name: Print Live URL
        working-directory: ./terraform
        run: terraform output cloudfront_domain_name